version: "3.5"
name: monitor-otel-collector-kafka-influx

services:
  
  otel-collector:
    image: otel/opentelemetry-collector
    container_name: otel-collector-producer
    command: ["--config=/etc/config.yml"]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/config.yml
    ports:
      - "4317:4317" # OTLP gRPC receiver port
      - "4318:4318"
      - "8889:8889" # Promentheus exporter metrics
    links:
      - broker
      - influxdb2
    networks:
      - default_bridge

  influxdb2:
    image: influxdb:2
    container_name: influxdb
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_BUCKET: observation
      DOCKER_INFLUXDB_INIT_ORG: obs-org
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2
    networks:
      - default_bridge
 

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - default_bridge
secrets:
  influxdb2-admin-username:
    file: influx/.env.influxdb2-admin-username
  influxdb2-admin-password:
    file: influx/.env.influxdb2-admin-password
  influxdb2-admin-token:
    file: influx/.env.influxdb2-admin-token
volumes:
  grafana:
  influxdb2-data:
  influxdb2-config:


networks:
  default_bridge:
    external: true
